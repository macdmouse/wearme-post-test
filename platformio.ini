; Wearme POST Test: firmware de banco que SOLO prueba la placa (POST) y muestra que el micro está vivo.
; Mismo hardware, variant y librerías de prueba que Wearme_Firmware_V3.1 (copiadas de ahí); sin FSM, sin anillo,
; sin Join LoRaWAN, sin muestreo de sensores ni registro en la SD. Ver README.md.
[platformio]
; Fuera de OneDrive (no sincroniza miles de objetos) y sin usuario fijo; distinta de la del firmware principal
build_dir = ${sysenv.TEMP}/pio_build_wearme_post

[env:seeed_wio_tracker_1110]
platform = https://github.com/SeeedJP/platform-nordicnrf52
board = seeed_wio_tracker_1110
framework = arduino
; Variant propio de la placa Wearme (variants/Wearme) en lugar del Wio Tracker del framework.
; La placa sigue siendo seeed_wio_tracker_1110: S140 6.1.1 + nrf52840_s140_v6.ld (igual que el
; bootloader del Feather nRF52840 Express) y ARDUINO_WIO_TRACKER_1110, que Wire y el core exigen.
board_build.variants_dir = variants
board_build.variant = Wearme
platform_packages =
    framework-arduinoadafruitnrf52 @ symlink://${sysenv.LOCALAPPDATA}/Arduino15/packages/Seeeduino/hardware/nrf52/1.1.13
lib_archive = no
lib_ldf_mode = deep+
; LBM_T1000E trae los mismos headers lbm/... que LBM_WM1110 y no compila para esta placa
lib_ignore = LBM_T1000E
lib_deps =
    https://github.com/ElectronicCats/CayenneLPP.git
; Actualización por Bluetooth: `pio run -t ota` (tools/pio_ota.py, tools/ota_dfu.py). Antes, poner el collar en
; modo AdaDFU por serie (DFU:OTA). tools/pio_ota.py además frena el build si el firmware pisa el contexto de LoRaWAN.
; Con varios collares en alcance, indicar cuál:
; tools/lbm_solo_au915.py: LBM solo con AU915 (ver build_flags)
extra_scripts =
    pre:tools/lbm_solo_au915.py
    post:tools/pio_ota.py
;custom_ota_address = CF:46:AF:60:35:5F
;custom_ota_serial = COM62

build_flags =
    ; include/: wearme_node.h (nodo a programar) y wearme_credentials.h (claves); también para las librerías de lib/
    -I include
    -L"${sysenv.LOCALAPPDATA}/Arduino15/packages/Seeeduino/hardware/nrf52/1.1.13/libraries/Adafruit_nRFCrypto/src/cortex-m4/fpv4-sp-d16-hard"
    -Wl,--wrap=smtc_modem_hal_print_trace
    -DARDUINO_WIO_TRACKER_1110
    -DNRF52840_XXAA
    -DUSBCON
    -DUSE_TINYUSB
    -DUSB_VID=0x2886
    -DUSB_PID=0x8055
    -DUSB_PRODUCT=\"Wio\ Tracker\ 1110\"
    -DUSB_MANUFACTURER=\"Seeed\"
    -DCFG_LOGGER=0
    -DPOWER_SUPPLY_GROVE=1
    -DLBM_CUSTOM=1
    -DSEGGER_RTT_MAX_NUM_UP_BUFFERS=2
    -DSEGGER_RTT_MAX_NUM_DOWN_BUFFERS=2
    -DSEGGER_RTT_MODE_DEFAULT=SEGGER_RTT_MODE_NO_BLOCK_SKIP
    -DBUFFER_SIZE_UP=2048
    -DBUFFER_SIZE_DOWN=4
    -DNRFX_NVMC_ENABLED=1
    -DNRFX_RNG_ENABLED=1
    -DNRFX_RTC_ENABLED=1
    -DNRFX_RTC2_ENABLED=1
    -DNRFX_RTC_DEFAULT_CONFIG_IRQ_PRIORITY=6
    -DNRFX_TIMER_ENABLED=1
    -DNRFX_TIMER2_ENABLED=1
    -DNRFX_WDT_ENABLED=1
    -DNRFX_WDT0_ENABLED=1
    -DLR11XX
    -DLR11XX_TRANSCEIVER
    -DUSE_LR11XX_CE
    -DENABLE_MODEM_GNSS_FEATURE
    -DRP2_103
    ; El nodo solo usa AU915 (lora_lib): tools/lbm_solo_au915.py deja fuera del build los region_*.c de las demás
    ; regiones (~13 KB de flash). Para volver a todas: quitar ese script y agregar -DREGION_AS_923 -DREGION_US_915
    ; -DREGION_EU_868 -DREGION_IN_865 -DREGION_KR_920 -DREGION_RU_864 -DREGION_CN_470 -DREGION_CN_470_RP_1_0
    ; -DREGION_WW2G4 -DWW2G4_SINGLE_DATARATE
    -DREGION_AU_915
    -DMODEM_HAL_DBG_TRACE=0
    -DMODEM_HAL_DEEP_DBG_TRACE=0
    -DMODEM_HAL_DBG_TRACE_RP=0
    -DMODEM_HAL_DBG_TRACE_COLOR=0
    ; Necesario: smtc_modem_time_start_sync_service (DeviceTimeReq, puesta en hora del RTC) solo existe con esto
    -DADD_SMTC_ALC_SYNC
    -DTASK_EXTENDED_1
    -DTASK_EXTENDED_2
    -DLR11XX_DISABLE_WARNINGS
    -DWIFI_MAX_RESULTS=32
    -DWIFI_TIMEOUT_PER_CHANNEL_DEFAULT=300
    -DWIFI_TIMEOUT_PER_SCAN_DEFAULT=90
    -DMW_DBG_TRACE=0
    -DMW_DBG_TRACE_COLOR=0
    -DWM1110_TRACE_MAX_LENGTH=256
    -DSERIAL_BAUDRATE=115200
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
